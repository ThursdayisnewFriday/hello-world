[JAMF]
server_url = https://your-jamf-instance.jamfcloud.com
username = your_api_username
password = your_api_password
# Alternative: use API token
api_token = 

[LICENSE_RECLAMATION]
# Days of inactivity before license reclamation
inactive_days_threshold = 90
# Grace period in days before actual reclamation
grace_period_days = 7
# Maximum number of licenses to reclaim per run
max_reclaims_per_run = 10

[NOTIFICATIONS]
# Email notifications
smtp_server = smtp.gmail.com
smtp_port = 587
email_username = your_email@company.com
email_password = your_app_password
admin_email = admin@company.com
# Slack webhook (optional)
slack_webhook_url = 

[LOGGING]
log_level = INFO
log_file = jamf_license_reclamation.log
max_log_size_mb = 50
backup_count = 5

[SCHEDULE]
# Run frequency (daily, weekly, monthly)
run_frequency = weekly
# Specific time to run (HH:MM format)
run_time = 02:00
# Days of week for weekly runs (0=Monday, 6=Sunday)
run_days = 0,3,5